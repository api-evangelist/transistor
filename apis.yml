  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.transistor.fm/#Subscriber
  baseURL: https://api.transistor.fm/v1
  properties:
  - url: https://developers.transistor.fm/
    type: Documentation
  - url: https://developers.transistor.fm/#Subscriber
    type: APIReference
  - url: openapi/transistor-openapi.yml
    type: OpenAPI
  - url: collections/transistor.postman_collection.json
    type: PostmanCollection
  - url: collections/transistor.opencollection.json
    type: OpenCollection
  description: Manage private (subscriber-only) podcast subscribers - list, retrieve,
    add single or batch subscribers with optional email invitations, update a
    subscriber's email, and remove subscribers. Private feeds gate episode access
    to authorized subscribers only.
- aid: transistor:transistor-webhooks-api
  name: Transistor Webhooks API
  tags:
  - Webhooks
