aid: transistor
url: https://raw.githubusercontent.com/api-evangelist/transistor/refs/heads/main/apis.yml
name: Transistor
kind: company
description: Transistor is a podcast hosting and analytics platform that lets teams
  host unlimited shows, distribute episodes to Apple Podcasts, Spotify, and YouTube,
  run private (subscriber-only) podcasts, and measure downloads with advanced
  analytics. Transistor exposes a documented public REST API at
  https://api.transistor.fm/v1 that follows the JSON:API specification, is
  authenticated with an x-api-key header, and covers shows, episodes, analytics,
  private podcast subscribers, and event webhooks.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Podcasting
- Podcast Hosting
- Analytics
- Media
- Audio
- JSON:API
created: '2026-07-05'
modified: '2026-07-05'
specificationVersion: '0.19'
