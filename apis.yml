    type: Documentation
  - url: https://developers.transistor.fm/#Episode
    type: APIReference
  - url: openapi/transistor-openapi.yml
    type: OpenAPI
  - url: collections/transistor.postman_collection.json
    type: PostmanCollection
  - url: collections/transistor.opencollection.json
    type: OpenCollection
  description: Create, list, retrieve, update, and publish podcast episodes. Includes
    authorizing an audio-file upload, creating draft episodes, and publishing,
    scheduling, or unpublishing an episode. Episodes are filterable by show, status,
    and full-text search.
- aid: transistor:transistor-analytics-api
  name: Transistor Analytics API
  tags:
