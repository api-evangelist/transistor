  name: Transistor Shows API
  tags:
  - Shows
  - Podcasts
  - JSON:API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.transistor.fm/#Show
  baseURL: https://api.transistor.fm/v1
