  - Downloads
  - Metrics
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.transistor.fm/#Analytics
  baseURL: https://api.transistor.fm/v1
  properties:
  - url: https://developers.transistor.fm/
    type: Documentation
  - url: https://developers.transistor.fm/#Analytics
    type: APIReference
  - url: openapi/transistor-openapi.yml
    type: OpenAPI
  - url: collections/transistor.postman_collection.json
    type: PostmanCollection
  - url: collections/transistor.opencollection.json
    type: OpenCollection
  description: Retrieve download analytics for a show over a date range, aggregate
    analytics across all episodes of a show, and per-episode download analytics.
    Data is returned as JSON:API resources with daily download counts.
- aid: transistor:transistor-subscribers-api
  name: Transistor Subscribers API
  tags:
