    type: OpenAPI
  - url: collections/transistor.postman_collection.json
    type: PostmanCollection
  - url: collections/transistor.opencollection.json
    type: OpenCollection
  description: List and retrieve the podcasts (shows) in your Transistor account and
    update show metadata. Returns JSON:API resources for each show, including title,
    description, author, artwork, and distribution details.
- aid: transistor:transistor-episodes-api
  name: Transistor Episodes API
  tags:
  - Episodes
  - Publishing
  - Audio
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.transistor.fm/#Episode
  baseURL: https://api.transistor.fm/v1
