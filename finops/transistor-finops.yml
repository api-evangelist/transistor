meters:
- name: subscription
  description: Flat recurring plan fee (Starter, Professional, Business, or Enterprise), billed monthly or yearly.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
- name: monthly_downloads
  description: Podcast episode downloads counted against the plan's monthly allowance; exceeding it pushes an upgrade.
  unit: downloads
  aggregation: sum
  dimensions:
  - account
  - show
- name: private_subscribers
  description: Number of active private podcast subscribers against the plan cap.
  unit: subscribers
  aggregation: max
  dimensions:
  - account
  - show
- name: transcription_addon
  description: Optional transcription add-on hours (5 or 20 hours per month) billed on top of the subscription.
  unit: hours
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track monthly downloads and private subscriber counts per show against the plan allowances to anticipate tier changes.
- name: Allocation
  description: Map shows to teams or clients so download and subscriber costs attribute to the right cost center.
- name: Optimization
  description: Right-size the plan to actual download volume; choose yearly billing (12 for 10) when usage is stable; add transcription hours only where needed.
- name: Accountability
  description: Assign an owner per account/show; review downloads and subscriber counts monthly against plan caps and the annual renewal.
