description: >-
  FinOps view of Transistor spend. Transistor is billed as a flat monthly (or
  yearly) subscription with tiered plans - Starter ($19), Professional ($49),
  Business ($99), and custom Enterprise. The primary cost drivers that move you
  between tiers are monthly podcast downloads and the number of private podcast
  subscribers; unlimited shows and full API access are included on every paid
  plan at no incremental cost. Yearly billing is offered at 12 months for the
  price of 10. Transcription add-ons carry additional cost.
notes: >-
  Prices captured 2026-07-05 from transistor.fm/pricing and may change. The API
  itself is not separately metered or billed - it is included with the
  subscription and rate-limited to 10 requests per 10 seconds. Verify current
  tier prices, download allowances, and add-on pricing during reconciliation.
